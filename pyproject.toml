[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymotion-studio"
version = "3.2.0"
description = "A Python-native, code-first video generation framework"
readme = "README.md"
license = {text = "PyMotion Source Available License 1.0"}
requires-python = ">=3.12"
keywords = ["video", "generation", "rendering", "motion-graphics", "animation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26,<3.0",
    "Pillow>=10.0,<14.0",
    "pycairo>=1.24",
    "ModernGL>=5.10",
    "ffmpeg-python>=0.2",
    "pydub>=0.25",
    "pedalboard>=0.9",
    "librosa>=0.10",
    "freetype-py>=2.4",
    "uharfbuzz>=0.38",
    "scipy>=1.11",
    "trimesh>=4.0",
    "svgwrite>=1.4",
    "cairosvg>=2.7",
    "httpx>=0.27",
    "structlog>=24.0",
    "rich>=13.0",
    "click>=8.1",
    "watchfiles>=0.21",
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/Ohswedd/pymotion"
Repository = "https://github.com/Ohswedd/pymotion"
Changelog = "https://github.com/Ohswedd/pymotion/blob/main/CHANGELOG.md"
Issues = "https://github.com/Ohswedd/pymotion/issues"

[project.optional-dependencies]
3d-extras = ["panda3d>=1.10", "pygltflib>=1.16"]
gpu-compute = ["wgpu>=0.15"]
html-backend = ["playwright>=1.40"]
audio-extra = ["soundfile>=0.12"]
jit = ["numba>=0.58"]
exr = ["pyopenexr>=3.0"]
physics = ["pybullet>=3.2"]
ai = ["rembg>=2.0", "segment-anything>=1.0", "transformers>=4.30", "diffusers>=0.25", "realesrgan>=0.3", "torch>=2.0"]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "pip-audit",
    "mkdocs-material",
    "mkdocstrings",
]

[tool.hatch.build.targets.wheel]
packages = ["pymotion"]

[project.scripts]
pymotion = "pymotion.cli.commands:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["openai.*", "whisper.*", "pyttsx3.*", "opentimelineio.*", "rembg.*", "segment_anything.*", "transformers.*", "diffusers.*", "cv2.*", "realesrgan.*", "torch.*", "wgpu.*", "ray.*", "dask.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pymotion"
