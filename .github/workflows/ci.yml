name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SYSTEM_DEPS: ffmpeg libcairo2-dev pkg-config libfreetype6-dev libharfbuzz-dev fonts-liberation

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $SYSTEM_DEPS
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff format check
        run: ruff format --check pymotion/ tests/
      - name: Ruff lint
        run: ruff check pymotion/ tests/
      - name: Mypy strict
        run: mypy --strict pymotion/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $SYSTEM_DEPS
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=pymotion --cov-report=xml --cov-fail-under=80 -v
      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $SYSTEM_DEPS
      - name: Install dependencies
        run: |
          pip install pip-audit
          pip install -e .
      - name: pip-audit
        run: pip-audit
        timeout-minutes: 5
