name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install ruff mypy
          pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check pymotion/ tests/
      - name: Lint check
        run: ruff check pymotion/ tests/
      - name: Type check
        run: mypy --strict pymotion/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libfreetype6-dev libharfbuzz-dev
      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=pymotion --cov-fail-under=85 -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pip-audit
          pip install -e .
      - name: Run audit
        run: pip-audit
