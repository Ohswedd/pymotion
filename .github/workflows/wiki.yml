name: Sync Docs to Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync docs to wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Clone wiki using the token
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki || {
            echo "::warning::Wiki repository not accessible. Ensure the wiki is initialized (create at least one page via the GitHub UI)."
            exit 0
          }

          # Clean wiki (except .git)
          find wiki -mindepth 1 -not -path 'wiki/.git*' -delete

          # Copy Home page
          if [ -f docs/index.md ]; then
            cp docs/index.md wiki/Home.md
          fi

          # Copy guides
          for f in docs/guides/*.md; do
            [ -f "$f" ] || continue
            cp "$f" "wiki/$(basename "$f")"
          done

          # Copy API reference with api- prefix
          for f in docs/api/*.md; do
            [ -f "$f" ] || continue
            cp "$f" "wiki/api-$(basename "$f")"
          done

          # Generate sidebar
          cat > wiki/_Sidebar.md << 'SIDEBAR'
          ### PyMotion Wiki

          **Guides**
          - [[Getting Started|getting-started]]
          - [[Keyframe Animation|keyframe-animation]]
          - [[Clip Operations|clip-operations]]
          - [[Compositing|compositing]]
          - [[Masking|masking]]
          - [[Expressions|expressions]]
          - [[Path Animation|path-animation]]
          - [[Keying Effects|keying]]
          - [[Layout, Tracking & Proxy|layout-tracking-proxy]]
          - [[Audio Mixing|audio-mixing]]
          - [[3D Scenes|3d-scenes]]
          - [[Text Animation|text-animation]]
          - [[Effects Pipeline|effects-pipeline]]
          - [[Transitions|transitions]]
          - [[Particles|particles]]
          - [[Template System|template-system]]
          - [[Batch Generation|batch-generation]]

          **API Reference**
          - [[Composition|api-composition]]
          - [[Clips|api-clips]]
          - [[Clip Operations|api-clip-operations]]
          - [[Masking|api-masking]]
          - [[Expressions|api-expressions]]
          - [[Path Animation|api-path-animation]]
          - [[Effects|api-effects]]
          - [[Keying|api-keying]]
          - [[Transitions|api-transitions]]
          - [[Layout|api-layout]]
          - [[Tracking & Proxy|api-tracking]]
          - [[Audio|api-audio]]
          - [[Animation|api-animation]]
          - [[Templates|api-templates]]
          SIDEBAR

          # Strip leading whitespace from sidebar (heredoc indentation)
          sed -i 's/^          //' wiki/_Sidebar.md

          # Push changes
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to commit"
          else
            git commit -m "docs: sync wiki from docs/ ($(date -u +%Y-%m-%d))"
            git push
          fi
