site_name: PyMotion
site_description: Python-native, code-first video generation framework
theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
