site_name: PyMotion
site_description: Python-native, code-first video generation framework
theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
nav:
  - Home: index.md
  - Getting Started: guides/getting-started.md
  - Guides:
    - Keyframe Animation: guides/keyframe-animation.md
    - Clip Operations: guides/clip-operations.md
    - Keying Effects: guides/keying.md
    - Layout, Tracking & Proxy: guides/layout-tracking-proxy.md
    - Audio Mixing: guides/audio-mixing.md
    - 3D Scenes: guides/3d-scenes.md
    - Batch Generation: guides/batch-generation.md
    - Text Animation: guides/text-animation.md
    - Effects Pipeline: guides/effects-pipeline.md
    - Transitions: guides/transitions.md
    - Particles: guides/particles.md
    - Template System: guides/template-system.md
  - API Reference:
    - Composition: api/composition.md
    - Clips: api/clips.md
    - Clip Operations: api/clip-operations.md
    - Effects: api/effects.md
    - Keying: api/keying.md
    - Transitions: api/transitions.md
    - Layout: api/layout.md
    - Tracking & Proxy: api/tracking.md
    - Audio: api/audio.md
    - Animation: api/animation.md
    - Templates: api/templates.md
